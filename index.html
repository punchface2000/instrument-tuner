<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Instrument Tuner</title>
    <meta name="description" content="Tune guitar, ukulele, bass and violin with your microphone, or find any note in chromatic mode." />
    <meta name="theme-color" content="#241612" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#EEF0EE" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tuner" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23241612'/%3E%3Cpath d='M16 5v22' stroke='%23D9A441' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M8 21h16' stroke='%23F1E8DA' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <nav class="views" id="views" aria-label="Instrument"></nav>
        <div class="tools">
          <button class="icon-btn" id="settings-btn" type="button" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2.25" /><circle cx="10" cy="17" r="2.25" /></svg>
          </button>
        </div>
      </header>

      <div class="subbar">
        <button class="tuning-btn" id="tuning-btn" type="button" aria-haspopup="dialog">
          <span class="tuning-name" id="tuning-name"></span>
          <span class="tuning-notes" id="tuning-notes"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" /></svg>
        </button>
        <button class="stand-btn" id="stand-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
          <span id="stand-btn-label"></span>
        </button>
      </div>

      <main class="stage" id="stage" data-state="idle">
        <section class="reading" aria-label="Tuner reading">
          <div class="note" id="note" aria-hidden="true">
            <span class="note-letter" id="note-letter">–</span>
            <span class="note-mods">
              <span class="note-acc" id="note-acc"></span>
              <span class="note-oct" id="note-oct"></span>
            </span>
          </div>

          <div class="scale" id="scale" aria-hidden="true">
            <div class="scale-zone" id="scale-zone"></div>
            <div class="scale-ticks" id="scale-ticks"></div>
            <div class="needle" id="needle"><span class="needle-head"></span></div>
            <div class="scale-labels"><span>−50</span><span>−25</span><span>0</span><span>+25</span><span>+50</span></div>
          </div>

          <p class="direction" id="direction"></p>
          <p class="detail"><span id="detail-cents"></span><span id="detail-hz"></span></p>
          <p class="sr-only" id="live" aria-live="polite"></p>

          <div class="start" id="start">
            <button class="start-btn" id="start-btn" type="button"></button>
            <p class="start-hint" id="start-hint"></p>
            <p class="error" id="error" role="alert" hidden></p>
          </div>
        </section>

        <section class="strings" id="strings-section">
          <div class="pegs" id="pegs" role="group" aria-label="Strings"></div>
          <div class="plays" id="plays" role="group" aria-label="Hear each string"></div>
          <div class="string-tools">
            <p class="string-hint" id="string-hint"></p>
          </div>
        </section>

        <section class="input-row" id="input-row" hidden>
          <label class="input-chip">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" /></svg>
            <span class="sr-only" id="quick-input-label"></span>
            <select id="quick-input" aria-labelledby="quick-input-label"></select>
          </label>
          <label class="input-chip" id="channel-chip" hidden>
            <span class="chip-text" id="channel-label"></span>
            <select id="quick-channel" aria-labelledby="channel-label"></select>
          </label>
        </section>

        <section class="meters" aria-label="Signal">
          <div class="meter">
            <span class="meter-label" id="level-label"></span>
            <span class="meter-track"><span class="meter-fill" id="level-fill"></span></span>
          </div>
          <div class="meter">
            <span class="meter-label" id="clarity-label"></span>
            <span class="meter-track"><span class="meter-fill" id="clarity-fill"></span></span>
          </div>
          <button class="stop-btn" id="stop-btn" type="button" hidden></button>
        </section>
      </main>
    </div>

    <div class="stand" id="stand" hidden data-dir="none">
      <p class="stand-hint" id="stand-hint"></p>
      <div class="stand-note" aria-hidden="true">
        <span class="stand-letter" id="stand-letter"></span>
        <span class="stand-mods"><span id="stand-acc"></span><span id="stand-oct"></span></span>
      </div>
      <div class="stand-info">
        <p class="stand-dir">
          <svg class="stand-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l8 10h-5v6H9v-6H4z" /></svg>
          <svg class="stand-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.5l5 5 10-11" /></svg>
          <span id="stand-dir-text"></span>
        </p>
        <p class="stand-cents" id="stand-cents"></p>
      </div>
      <div class="stand-bar" aria-hidden="true"><span class="stand-zone" id="stand-zone"></span><span class="stand-mark" id="stand-mark"></span></div>
      <p class="sr-only" aria-live="polite" id="stand-live"></p>
    </div>

    <dialog class="sheet" id="tuning-dialog" aria-labelledby="tuning-title">
      <form method="dialog" class="sheet-body">
        <div class="sheet-head">
          <h2 id="tuning-title"></h2>
          <button class="icon-btn" value="close" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <div class="tuning-list" id="preset-list" role="radiogroup"></div>
        <div class="tuning-group" id="custom-group">
          <h3 class="group-title" id="custom-title"></h3>
          <div class="tuning-list" id="custom-list" role="radiogroup"></div>
        </div>
        <button type="button" class="add-btn" id="new-tuning-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          <span id="new-tuning-label"></span>
        </button>
      </form>
    </dialog>

    <dialog class="sheet" id="editor-dialog" aria-labelledby="editor-title">
      <form class="sheet-body" id="editor-form">
        <div class="sheet-head">
          <h2 id="editor-title"></h2>
          <button class="icon-btn" type="button" id="editor-close" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <div class="field">
          <label class="field-label" for="editor-name" id="editor-name-label"></label>
          <input type="text" class="text-input" id="editor-name" maxlength="30" autocomplete="off" />
        </div>
        <div class="field">
          <div class="field-text">
            <span class="field-label" id="editor-strings-label"></span>
            <span class="field-hint" id="editor-strings-hint"></span>
          </div>
          <button type="button" class="add-row" id="add-low"></button>
          <ol class="string-rows" id="string-rows"></ol>
          <button type="button" class="add-row" id="add-high"></button>
        </div>
        <div class="editor-actions">
          <button type="button" class="text-btn danger" id="editor-delete" hidden></button>
          <span class="spacer"></span>
          <button type="button" class="ghost-btn" id="editor-cancel"></button>
          <button type="submit" class="primary-btn" id="editor-save"></button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" hidden>
      <span id="toast-text"></span>
      <button type="button" class="toast-btn" id="toast-btn" hidden></button>
      <button type="button" class="toast-close" id="toast-close" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </div>

    <dialog class="sheet" id="settings-dialog" aria-labelledby="settings-title">
      <form method="dialog" class="sheet-body">
        <div class="sheet-head">
          <h2 id="settings-title"></h2>
          <button class="icon-btn" value="close" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>

        <div class="field">
          <div class="field-text">
            <span class="field-label" id="a4-label"></span>
            <span class="field-hint" id="a4-hint"></span>
          </div>
          <div class="stepper" role="group" aria-labelledby="a4-label">
            <button type="button" class="step" id="a4-down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" /></svg></button>
            <output id="a4-value"></output>
            <button type="button" class="step" id="a4-up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12" /></svg></button>
          </div>
        </div>

        <div class="field">
          <div class="field-text">
            <label class="field-label" id="tol-label" for="tol-range"></label>
            <span class="field-hint" id="tol-hint"></span>
          </div>
          <div class="range-row">
            <input type="range" id="tol-range" min="1" max="10" step="1" />
            <output id="tol-value"></output>
          </div>
        </div>

        <div class="field">
          <div class="field-text"><label class="field-label" id="mic-label" for="mic-select"></label></div>
          <select id="mic-select"></select>
        </div>

        <div class="field">
          <div class="field-text"><span class="field-label" id="theme-label"></span></div>
          <div class="segmented" id="theme-seg" role="radiogroup" aria-labelledby="theme-label"></div>
        </div>

        <div class="sheet-links">
          <button type="button" class="text-btn" id="help-btn"></button>
          <button type="button" class="text-btn" id="reset-tuned"></button>
          <button type="button" class="text-btn" id="save-clip"></button>
        </div>
        <p class="field-hint" id="save-clip-hint"></p>
        <p class="field-hint version" id="app-version"></p>
      </form>
    </dialog>

    <dialog class="sheet" id="help-dialog" aria-labelledby="help-title">
      <form method="dialog" class="sheet-body">
        <div class="sheet-head">
          <h2 id="help-title"></h2>
          <button class="icon-btn" value="close" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <ol class="help-list" id="help-list"></ol>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
